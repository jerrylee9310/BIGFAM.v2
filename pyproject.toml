[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bigfam"
version = "0.2.1"
description = "Genetic and shared-environment variance decomposition from relative pairs, without genotypes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Jaeeun Lee" },
    { name = "Buhm Han" },
]
keywords = ["genetics", "heritability", "shared environment", "variance decomposition"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
]

[project.urls]
Repository = "https://github.com/jerrylee9310/BIGFAM.v2"

[project.optional-dependencies]
dev = ["pytest"]
parquet = ["pyarrow"]   # optional: load_pairs prefers .parquet over .csv when present
analysis = ["pyarrow", "matplotlib", "seaborn"]   # analysis/ figure replication scripts

[tool.hatch.build.targets.wheel]
packages = ["bigfam"]

[tool.hatch.build.targets.wheel.force-include]
"bigfam/artifacts/wc_calibration.json" = "bigfam/artifacts/wc_calibration.json"
